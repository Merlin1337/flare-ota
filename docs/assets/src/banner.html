<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:400px;font-family:Inter,-apple-system,"SF Pro Display",system-ui,sans-serif;color:#f5f2ee;background:#0b0a09;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(600px 380px at 82% 30%,rgba(249,115,22,.35),transparent 70%),radial-gradient(500px 300px at 10% 110%,rgba(251,191,36,.12),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.wrap{position:relative;display:flex;align-items:center;height:100%;padding:0 80px;gap:60px}
.left{flex:1}
.logo{display:flex;align-items:center;gap:18px}
.logo svg{width:68px;height:68px;filter:drop-shadow(0 6px 24px rgba(249,115,22,.55))}
h1{font-size:76px;font-weight:750;letter-spacing:-.045em}
p{font-size:26px;line-height:1.35;color:#d6d0c9;margin-top:18px;letter-spacing:-.01em}
p b{color:#fff;font-weight:650}
.chips{display:flex;gap:10px;margin-top:28px}
.chips span{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#e9e4de}
.phone{width:210px;height:330px;border-radius:40px;background:#161412;border:2px solid #2c2723;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #0f0e0d;position:relative;margin-top:70px;overflow:hidden}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:20px;border-radius:12px;background:#000}
.card{position:absolute;left:14px;right:14px;top:58px;border-radius:18px;background:#221e1b;border:1px solid #332d28;padding:14px}
.card small{display:block;font-size:11px;color:#a19a93;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.card b{display:block;font-size:15px;margin-top:4px}
.card .bar{height:6px;border-radius:3px;background:#332d28;margin-top:12px;overflow:hidden}.card .bar i{display:block;height:100%;width:72%;background:linear-gradient(90deg,#fb923c,#f97316)}
.card2{top:170px}
.badge{position:absolute;right:-8px;top:40px;background:#f97316;color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;box-shadow:0 8px 30px rgba(249,115,22,.5)}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="wrap"><div class="left">
<div class="logo"><svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><path fill="url(#g)" d="M12.6 2.2c.4 3-1.3 4.6-2.8 6.2C8.2 10 6.6 11.7 6.6 14.6A5.4 5.4 0 0 0 12 20a5.4 5.4 0 0 0 5.4-5.4c0-2.2-1-3.7-2.1-5 .1 1.5-.4 2.7-1.6 3.4.4-3.9-.4-7.6-1.1-10.8z"/></svg><h1>flare-ota</h1></div>
<p><b>Self-hosted OTA updates for Expo</b>, on your own Cloudflare account.<br>The standard <b>expo-updates</b> client. No EAS Update, no custom SDK.</p>
<div class="chips"><span>Workers</span><span>D1</span><span>R2</span><span>Access</span><span>MCP</span></div>
</div>
<div class="phone"><div class="notch"></div>
<div class="card"><small>Update ready</small><b>Fix checkout crash</b><div class="bar"><i></i></div></div>
<div class="card card2"><small>Rollout</small><b>production · 25%</b><div class="bar"><i style="width:25%"></i></div></div>
</div></div></body></html>
